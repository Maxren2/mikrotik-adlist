name: Update DNS Filters

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

# Never let a scheduled run collide with a manual one
concurrency:
  group: update-filters
  cancel-in-progress: false

jobs:
  update-filters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Must stay true: this job pushes the regenerated lists back to main
          persist-credentials: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Make transform script executable
        run: chmod +x transform.sh

      - name: Run transform script
        run: ./transform.sh ./filters.json

      - name: Check for changes
        id: check-changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in hosts directory"
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Commit and push updated filters
        if: steps.check-changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A hosts
          git commit -m "Update DNS filters - ${{ steps.date.outputs.date }}" \
                     -m "Source: hagezi/dns-blocklists via filters.json" \
                     -m "Run ID: ${{ github.run_id }}"

          # A concurrent push may have landed while this run was downloading
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected, rebasing and retrying ($attempt/3)"
            git pull --rebase --autostash
          done

          echo "::error::Failed to push updated filters after 3 attempts"
          exit 1

      - name: Summary
        run: |
          if [[ "${{ steps.check-changes.outputs.changes }}" == "true" ]]; then
            echo "### :white_check_mark: DNS filters updated" >> $GITHUB_STEP_SUMMARY
            echo "Committed directly to \`main\` on ${{ steps.date.outputs.date }}." >> $GITHUB_STEP_SUMMARY
          else
            echo "### :information_source: No changes" >> $GITHUB_STEP_SUMMARY
            echo "Filters are already up to date." >> $GITHUB_STEP_SUMMARY
          fi
